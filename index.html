<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Món Quà 20/10 Dành Riêng Cho Em 🍓🐰</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --sky-top: #ffd6e6;
      --sky-mid: #ffeaf2;
      --sky-warm: #fff5ea;
      --text-dark: #572639;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #ffe5ef;
      font-family: 'Quicksand', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-dark);
      touch-action: manipulation;
    }

    /* ==========================================================================
       FULL-VIEWPORT 3D ENVIRONMENT
       ========================================================================== */
    #viewportWorld {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      perspective: 1100px;
      background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 52%, var(--sky-warm) 100%);
      transition: filter 1.2s ease, background 1.5s ease;
    }

    #viewportWorld.warm-bloom {
      background: linear-gradient(180deg, #ffc8df 0%, #ffe3ee 48%, #fff1df 100%);
    }

    #hugWarmAura {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 19;
      background: radial-gradient(circle at 50% 52%, transparent 35%, rgba(255, 130, 175, 0.35) 100%);
      opacity: 0;
      transition: opacity 1.2s ease;
    }

    #hugWarmAura.active {
      opacity: 1;
      animation: auraPulse 2.4s ease-in-out infinite alternate;
    }

    @keyframes auraPulse {
      0% { opacity: 0.7; }
      100% { opacity: 1; }
    }

    .sky-glow {
      position: absolute;
      top: -15%;
      left: 50%;
      width: 110vw;
      height: 75vh;
      transform: translateX(-50%);
      background: radial-gradient(circle, rgba(255,255,255,0.88) 0%, rgba(255,220,235,0.42) 45%, transparent 72%);
      pointer-events: none;
      z-index: 1;
    }

    /* Drifting 3D Pastel Clouds */
    .cloud-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }

    .cloud {
      position: absolute;
      background: linear-gradient(180deg, #ffffff 0%, #ffe9f2 100%);
      border-radius: 999px;
      box-shadow: 0 14px 28px rgba(215, 130, 160, 0.16), inset 0 -6px 12px rgba(255, 195, 215, 0.45);
      opacity: 0.88;
      animation: floatCloud 26s ease-in-out infinite alternate;
    }

    .cloud::before, .cloud::after {
      content: '';
      position: absolute;
      background: inherit;
      border-radius: 50%;
    }

    .cloud-1 { width: 150px; height: 48px; top: 10%; left: 5%; }
    .cloud-1::before { width: 68px; height: 68px; top: -32px; left: 20px; }
    .cloud-1::after { width: 54px; height: 54px; top: -22px; left: 72px; }

    .cloud-2 { width: 180px; height: 56px; top: 14%; right: 6%; animation-duration: 32s; animation-delay: -6s; }
    .cloud-2::before { width: 80px; height: 80px; top: -38px; left: 26px; }
    .cloud-2::after { width: 64px; height: 64px; top: -26px; left: 86px; }

    @keyframes floatCloud {
      0% { transform: translateX(-14px) translateY(0); }
      100% { transform: translateX(18px) translateY(-6px); }
    }

    /* ==========================================================================
       CAMERA RIG & PARALLAX MEADOW HILLS
       ========================================================================== */
    #worldCamera {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      transition: transform 1.35s cubic-bezier(0.25, 0.9, 0.3, 1);
      z-index: 4;
    }

    .hills-distant {
      position: absolute;
      bottom: 25%;
      left: -18%;
      width: 136%;
      height: 36%;
      background: linear-gradient(180deg, #f7d9e8 0%, #e7f4dc 55%, #d6ecc8 100%);
      border-radius: 50% 50% 0 0 / 100% 100% 0 0;
      box-shadow: inset 0 14px 30px rgba(255, 255, 255, 0.7);
      z-index: 2;
    }

    .meadow-midground {
      position: absolute;
      bottom: -6%;
      left: -14%;
      width: 128%;
      height: 48%;
      background: radial-gradient(ellipse at 50% 15%, #eef9e3 0%, #d8f0c8 48%, #c2e5b0 100%);
      border-radius: 48% 52% 0 0 / 60% 60% 0 0;
      box-shadow: 0 -10px 32px rgba(170, 210, 150, 0.35), inset 0 18px 38px rgba(255, 255, 255, 0.75);
      z-index: 3;
    }

    .garden-path {
      position: absolute;
      bottom: -4%;
      left: 50%;
      transform: translateX(-50%) perspective(350px) rotateX(52deg);
      width: min(360px, 78vw);
      height: 46vh;
      background: linear-gradient(180deg, rgba(255, 238, 224, 0.55) 0%, rgba(255, 225, 210, 0.9) 100%);
      border-radius: 50%;
      filter: blur(4px);
      z-index: 3;
    }

    #gardenFlowersBack, #gardenFlowersFront {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    #gardenFlowersBack { z-index: 4; }
    #gardenFlowersFront { z-index: 16; }

    .flower-item {
      position: absolute;
      transform-origin: bottom center;
      animation: swayFlower 4.2s ease-in-out infinite alternate;
      transition: transform 0.9s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.8s ease;
    }

    .flower-item.bud-closed {
      transform: scale(0.32) translateY(20px);
      opacity: 0.55;
    }

    .flower-item.bloomed {
      transform: scale(1) translateY(0);
      opacity: 1;
    }

    @keyframes swayFlower {
      0% { rotate: -4deg; }
      100% { rotate: 5deg; }
    }

    /* ==========================================================================
       CENTER STAGE ACTORS
       ========================================================================== */
    #stageCenter {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      pointer-events: none;
    }

    /* 1. 3D Envelope */
    #envelopeActor {
      position: absolute;
      top: 54%;
      left: 50%;
      width: min(300px, 80vw);
      height: min(198px, 53vw);
      transform: translate(-50%, -50%);
      transform-style: preserve-3d;
      transition: transform 1s cubic-bezier(0.34, 1.4, 0.64, 1), opacity 0.9s ease;
      z-index: 8;
    }

    #envelopeActor.idle-Invite {
      animation: envelopeInvite 3s ease-in-out infinite;
    }

    @keyframes envelopeInvite {
      0%, 100% { transform: translate(-50%, -50%) translateY(0) rotate(0deg); }
      50% { transform: translate(-50%, -50%) translateY(-8px) rotate(-1.2deg); }
    }

    .env-shadow {
      position: absolute;
      bottom: -24px;
      left: 8%;
      width: 84%;
      height: 28px;
      background: radial-gradient(ellipse, rgba(160, 75, 105, 0.28) 0%, transparent 72%);
      border-radius: 50%;
    }

    .env-back {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, #fff6ee 0%, #fde4d8 100%);
      border-radius: 18px;
      box-shadow: 0 18px 40px rgba(175, 85, 115, 0.22), inset 0 2px 6px #ffffff;
      border: 2px solid #f9d5c8;
    }

    .env-inner-glow {
      position: absolute;
      inset: 8px;
      border-radius: 14px;
      background: radial-gradient(circle at 50% 35%, rgba(255, 120, 165, 0.85), transparent 72%);
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    #envelopeActor.open .env-inner-glow {
      opacity: 1;
    }

    .env-pocket {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
    }

    .env-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 58%;
      transform-origin: top center;
      transition: transform 0.95s cubic-bezier(0.4, 0, 0.2, 1), z-index 0.2s 0.4s;
      z-index: 6;
      filter: drop-shadow(0 6px 8px rgba(165, 80, 105, 0.15));
    }

    #envelopeActor.open .env-flap {
      transform: rotateX(175deg);
      z-index: 1;
    }

    #envelopeActor.fade-away {
      transform: translate(-50%, 40%) scale(0.75);
      opacity: 0;
    }

    /* ==========================================================================
       2. STRAWBERRY BUNNY ACTOR
       ========================================================================== */
    #strawberryBunnyActor {
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(330px, 82vw);
      height: min(320px, 80vw);
      transform: translate(-50%, -50%) scale(0.76);
      transition: transform 0.85s cubic-bezier(0.34, 1.45, 0.64, 1), top 0.85s ease, left 0.85s ease;
      z-index: 14;
      pointer-events: none;
    }

    #strawberryBunnySvg {
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 16px 24px rgba(155, 55, 85, 0.22));
    }

    #sb-leaves-group {
      transform-origin: 180px 72px;
      animation: leafBreeze 2.8s ease-in-out infinite alternate;
    }

    @keyframes leafBreeze {
      0% { transform: rotate(-3deg); }
      100% { transform: rotate(3deg); }
    }

    #sb-wing-left,
    #sb-wing-right {
      transform-origin: 180px 74px;
      opacity: 0;
    }

    /* Continuous Ear-Flapping ("Ve vẩy tai trong suốt quá trình hiển thị text") */
    #strawberryBunnyActor.ears-flapping #sb-wing-left {
      opacity: 1;
      animation: continuousEarFlapLeft 1.85s ease-in-out infinite;
    }

    #strawberryBunnyActor.ears-flapping #sb-wing-right {
      opacity: 1;
      animation: continuousEarFlapRight 1.85s ease-in-out infinite;
    }

    #strawberryBunnyActor.ears-excited #sb-wing-left {
      opacity: 1;
      animation: happyEarFlapLeft 0.95s ease-in-out infinite;
    }

    #strawberryBunnyActor.ears-excited #sb-wing-right {
      opacity: 1;
      animation: happyEarFlapRight 0.95s ease-in-out infinite;
    }

    @keyframes continuousEarFlapLeft {
      0%, 100% { transform: rotate(0deg) scaleX(1); }
      45% { transform: rotate(8.5deg) translateY(-3px) scaleX(1.02); }
      75% { transform: rotate(-2.2deg) translateY(1px) scaleX(0.99); }
    }

    @keyframes continuousEarFlapRight {
      0%, 100% { transform: rotate(0deg) scaleX(1); }
      45% { transform: rotate(-8.5deg) translateY(-3px) scaleX(1.02); }
      75% { transform: rotate(2.2deg) translateY(1px) scaleX(0.99); }
    }

    @keyframes happyEarFlapLeft {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(12deg) translateY(-4px); }
    }

    @keyframes happyEarFlapRight {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-12deg) translateY(-4px); }
    }

    #bunny-head-group {
      transform-origin: 180px 150px;
      transition: transform 0.5s ease;
    }

    #bunny-eyes {
      transform-origin: 180px 151px;
      animation: bunnyBlink 4.2s infinite;
    }

    @keyframes bunnyBlink {
      0%, 92%, 98%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.12); }
    }

    #bunny-arm-left {
      transform-origin: 134px 196px;
      transition: transform 0.45s cubic-bezier(0.34, 1.5, 0.64, 1), opacity 0.3s ease;
      animation: armIdleLeft 2.8s ease-in-out infinite alternate;
    }

    #bunny-arm-right {
      transform-origin: 226px 196px;
      transition: transform 0.45s cubic-bezier(0.34, 1.5, 0.64, 1), opacity 0.3s ease;
      animation: armIdleRight 2.8s ease-in-out infinite alternate;
    }

    @keyframes armIdleLeft {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(5deg); }
    }

    @keyframes armIdleRight {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-5deg); }
    }

    /* Under-Heart Shoulder Attachment Roots (Strictly UNDER the Heart in Layer 1) */
    #bunny-hug-shoulders-back {
      opacity: 0;
      transition: opacity 0.35s ease;
      pointer-events: none;
    }

    /* Over-Heart Curved Forearms & Paws (Wrapping Front of the Heart in Layer 4) */
    #bunny-curved-hug-arms {
      opacity: 0;
      transition: opacity 0.35s ease;
      pointer-events: none;
    }

    #curved-arm-left {
      transform-origin: 112px 218px;
      transform: scaleX(0.6) rotate(22deg);
      transition: transform 0.65s cubic-bezier(0.34, 1.45, 0.64, 1);
    }

    #curved-arm-right {
      transform-origin: 248px 218px;
      transform: scaleX(0.6) rotate(-22deg);
      transition: transform 0.65s cubic-bezier(0.34, 1.45, 0.64, 1);
    }

    /* Held Glowing Heart Object */
    #bunny-held-gift {
      transform-origin: 180px 92px;
      opacity: 0;
      transform: translateY(75px) scale(0.2);
      transition: transform 0.85s cubic-bezier(0.28, 1.45, 0.55, 1), opacity 0.45s ease;
    }

    /* --- BUNNY ACTION POSES --- */
    #strawberryBunnyActor.hopping {
      animation: bunnyRunHop 0.48s cubic-bezier(0.35, 0, 0.65, 1) infinite alternate;
    }

    @keyframes bunnyRunHop {
      0% { transform: translate(-50%, -46%) scale(0.96, 1.04) rotate(-3deg); }
      100% { transform: translate(-50%, -62%) scale(1.04, 0.96) rotate(3deg); }
    }

    #strawberryBunnyActor.opening-box {
      transform: translate(-56%, -44%) scale(0.94) rotate(5deg);
    }
    #strawberryBunnyActor.opening-box #bunny-head-group {
      transform: translateY(4px) rotate(6deg);
    }
    #strawberryBunnyActor.opening-box #bunny-arm-left {
      animation: none;
      transform: rotate(-45deg) translate(-4px, 8px);
    }
    #strawberryBunnyActor.opening-box #bunny-arm-right {
      animation: none;
      transform: rotate(-60deg) translate(10px, -4px);
    }

    #strawberryBunnyActor.lifting-gift {
      transform: translate(-50%, -44%) scale(1.0);
      animation: proudBounce 2.2s ease-in-out infinite alternate;
    }
    #strawberryBunnyActor.lifting-gift #bunny-arm-left {
      animation: none;
      transform: rotate(114deg) translate(-6px, -4px);
    }
    #strawberryBunnyActor.lifting-gift #bunny-arm-right {
      animation: none;
      transform: rotate(-114deg) translate(6px, -4px);
    }
    #strawberryBunnyActor.lifting-gift #bunny-head-group {
      transform: translateY(-3px);
    }
    #strawberryBunnyActor.lifting-gift #bunny-held-gift {
      opacity: 1;
      transform: translateY(0px) scale(1);
    }

    @keyframes proudBounce {
      0% { transform: translate(-50%, -43%) scale(0.99); }
      100% { transform: translate(-50%, -47%) scale(1.02); }
    }

    /* Pose 3 (SCENE 5): Enlarged Bunny in Center + Left/Right Hand Push into Box! */
    #strawberryBunnyActor.rummaging-center {
      top: 47%;
      left: 50%;
      transform: translate(-50%, -50%) scale(1.14);
    }
    #strawberryBunnyActor.rummaging-center #bunny-head-group {
      transform: translateY(6px);
    }
    #strawberryBunnyActor.push-left #bunny-arm-left {
      animation: none;
      transform: rotate(-68deg) translate(-12px, 24px) scaleY(1.22);
    }
    #strawberryBunnyActor.push-left #bunny-arm-right {
      animation: none;
      transform: rotate(24deg) translate(-6px, -6px);
    }
    #strawberryBunnyActor.push-left #bunny-head-group {
      transform: translateY(6px) rotate(-5deg);
    }

    #strawberryBunnyActor.push-right #bunny-arm-right {
      animation: none;
      transform: rotate(68deg) translate(12px, 24px) scaleY(1.22);
    }
    #strawberryBunnyActor.push-right #bunny-arm-left {
      animation: none;
      transform: rotate(-24deg) translate(6px, -6px);
    }
    #strawberryBunnyActor.push-right #bunny-head-group {
      transform: translateY(6px) rotate(5deg);
    }

    /* Step 4A: Pulling Heart Out of the Box High */
    #strawberryBunnyActor.pulling-heart-out {
      top: 49%;
      left: 50%;
      transform: translate(-50%, -50%) scale(1.16);
    }
    #strawberryBunnyActor.pulling-heart-out #bunny-arm-left {
      animation: none;
      transform: rotate(95deg) translate(-6px, -4px);
    }
    #strawberryBunnyActor.pulling-heart-out #bunny-arm-right {
      animation: none;
      transform: rotate(-95deg) translate(6px, -4px);
    }
    #strawberryBunnyActor.pulling-heart-out #bunny-held-gift {
      opacity: 1;
      transform: translateY(18px) scale(0.95);
    }

    /* Step 4B: Lowering Heart Down to Chest & Wrapping Curved Forearms Around Front + Swaying! */
    #strawberryBunnyActor.hugging-lowered-heart {
      top: 52%;
      left: 50%;
      transform: translate(-50%, -50%) scale(1.18);
      animation: bunnyGentleSway 2.4s ease-in-out infinite alternate;
    }
    #strawberryBunnyActor.hugging-lowered-heart #bunny-held-gift {
      opacity: 1;
      transform: translateY(132px) scale(1.04);
    }
    #strawberryBunnyActor.hugging-lowered-heart #bunny-arm-left,
    #strawberryBunnyActor.hugging-lowered-heart #bunny-arm-right {
      opacity: 0;
      animation: none;
    }
    #strawberryBunnyActor.hugging-lowered-heart #bunny-hug-shoulders-back {
      opacity: 1;
    }
    #strawberryBunnyActor.hugging-lowered-heart #bunny-curved-hug-arms {
      opacity: 1;
    }
    #strawberryBunnyActor.hugging-lowered-heart #curved-arm-left {
      transform: scaleX(1) rotate(0deg);
    }
    #strawberryBunnyActor.hugging-lowered-heart #curved-arm-right {
      transform: scaleX(1) rotate(0deg);
    }

    @keyframes bunnyGentleSway {
      0% { transform: translate(-50%, -50%) scale(1.18) rotate(-4.5deg); }
      100% { transform: translate(-50%, -50%) scale(1.18) rotate(4.5deg); }
    }

    /* ==========================================================================
       3. 3D GIFT BOX IN THE GARDEN
       ========================================================================== */
    #giftBoxActor {
      position: absolute;
      top: 60%;
      left: 64%;
      width: min(145px, 36vw);
      height: min(136px, 34vw);
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
      transition:
        transform 0.55s cubic-bezier(0.34, 1.45, 0.64, 1),
        opacity 0.55s ease,
        left 0.8s cubic-bezier(0.28, 1.2, 0.55, 1),
        top 0.8s cubic-bezier(0.28, 1.2, 0.55, 1);
      z-index: 13;
    }

    #giftBoxActor.visible {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }

    #giftBoxActor.react-touch {
      animation: boxSquash 0.55s ease;
    }

    /* Gift Box stays visibly parked on the lower-left side during the Note Paper scene */
    #giftBoxActor.lower-aside {
      top: 82%;
      left: clamp(16%, 20vw, 24%);
      transform: translate(-50%, -50%) scale(0.74);
      opacity: 1;
      z-index: 12;
    }

    /* Gift Box Positioned Right in the Middle of the Enlarged Bunny in Scene 5 */
    #giftBoxActor.center-in-front-of-bunny {
      top: 65%;
      left: 50%;
      opacity: 1;
      z-index: 15;
      transform: translate(-50%, -50%) scale(1.02);
      transition:
        transform 0.36s cubic-bezier(0.34, 1.45, 0.64, 1),
        left 0.75s cubic-bezier(0.28, 1.2, 0.55, 1),
        top 0.75s cubic-bezier(0.28, 1.2, 0.55, 1);
    }

    #giftBoxActor.center-in-front-of-bunny.tilt-left {
      transform: translate(-54%, -47%) scale(1.05, 0.92) rotate(-11deg);
    }

    #giftBoxActor.center-in-front-of-bunny.tilt-right {
      transform: translate(-46%, -47%) scale(1.05, 0.92) rotate(11deg);
    }

    @keyframes boxSquash {
      0%, 100% { transform: translate(-50%, -50%) scale(1, 1); }
      40% { transform: translate(-50%, -44%) scale(1.12, 0.86); }
      75% { transform: translate(-50%, -55%) scale(0.94, 1.07); }
    }

    #giftLidGroup {
      transform-origin: 25px 52px;
      transition: transform 0.85s cubic-bezier(0.34, 1.4, 0.64, 1);
    }

    #giftRibbonBow {
      transform-origin: 100px 45px;
      transition: transform 0.7s ease, opacity 0.6s ease;
    }

    #giftBoxActor.open #giftLidGroup {
      transform: translate(-18px, -34px) rotate(-42deg);
    }

    #giftBoxActor.open #giftRibbonBow {
      transform: translateY(-28px) scale(1.15);
      opacity: 0;
    }

    /* ==========================================================================
       4. PORTRAIT COUPLE PHOTO FRAME (3:4 VERTICAL RATIO FOR image_d34da2.jpg)
       ========================================================================== */
    #photoMemoryActor {
      position: absolute;
      top: 60%;
      left: 62%;
      width: clamp(84px, 22vw, 114px);
      padding: 6px 6px 20px 6px;
      background: #ffffff;
      border-radius: 14px;
      border: 2px solid #ffd4e3;
      box-shadow: 0 14px 30px rgba(165, 50, 90, 0.25), 0 2px 6px rgba(255,255,255,0.9);
      transform: translate(-50%, -50%) scale(0.15) rotate(-12deg);
      opacity: 0;
      transition:
        top 1.25s cubic-bezier(0.28, 1.25, 0.55, 1),
        left 1.25s cubic-bezier(0.28, 1.25, 0.55, 1),
        transform 1.25s cubic-bezier(0.28, 1.25, 0.55, 1),
        opacity 0.5s ease;
      z-index: 15;
      pointer-events: none;
    }

    /* Vertical 3:4 Polaroid Frame tailored to the couple portrait photo */
    #photoMemoryActor .photo-inner-wrap {
      width: 100%;
      aspect-ratio: 3 / 4;
      border-radius: 9px;
      overflow: hidden;
      background: #fff5f8;
      border: 1px solid #ffe8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    #memoryPhotoImg {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 18%;
      display: block;
      background: #ffffff;
    }

    .photo-caption-heart {
      position: absolute;
      bottom: 3px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10.5px;
      color: #ff4d82;
      font-weight: 700;
      letter-spacing: 0.8px;
      white-space: nowrap;
    }

    #photoMemoryActor.state-from-box {
      opacity: 1;
      top: 52%;
      left: 60%;
      transform: translate(-50%, -50%) scale(0.72) rotate(-6deg);
    }

    #photoMemoryActor.state-on-heart {
      opacity: 1;
      top: 29%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.96) rotate(0deg);
      box-shadow: 0 0 26px rgba(255, 105, 155, 0.65), 0 12px 28px rgba(165, 50, 90, 0.28);
    }

    #photoMemoryActor.state-docked-right {
      opacity: 1;
      top: 44%;
      left: calc(100vw - clamp(82px, 13vw, 130px));
      transform: translate(-50%, -50%) scale(1.24) rotate(5deg);
      z-index: 22;
      animation: dockedPhotoFloat 3.6s ease-in-out infinite alternate;
    }

    @keyframes dockedPhotoFloat {
      0% { transform: translate(-50%, -50%) scale(1.24) rotate(4deg) translateY(0px); }
      100% { transform: translate(-50%, -50%) scale(1.24) rotate(6.5deg) translateY(-8px); }
    }

    /* 3D Animated Butterfly Carrier */
    #butterflyActor {
      position: absolute;
      top: 18%;
      left: -12%;
      width: 66px;
      height: 66px;
      transform: translate(-50%, -50%) scale(0.9);
      opacity: 0;
      transition:
        top 1.2s cubic-bezier(0.35, 0.85, 0.4, 1),
        left 1.2s cubic-bezier(0.35, 0.85, 0.4, 1),
        transform 1.2s ease,
        opacity 0.4s ease;
      z-index: 24;
      pointer-events: none;
    }

    .bf-wing-left, .bf-wing-right {
      transform-origin: 50px 50px;
      animation: butterflyFlap 0.16s ease-in-out infinite alternate;
    }

    @keyframes butterflyFlap {
      0% { transform: scaleX(1) rotate(4deg); }
      100% { transform: scaleX(0.38) rotate(-6deg); }
    }

    /* ==========================================================================
       5. NOTE PAPER FRAME IN THE GARDEN (#notePaperActor)
       ========================================================================== */
    #notePaperActor {
      position: absolute;
      top: 62%;
      left: 50%;
      width: min(540px, 92vw);
      transform: translate(-50%, -50%) scale(0.25) rotate(-6deg);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.9s cubic-bezier(0.28, 1.35, 0.55, 1), opacity 0.7s ease;
      z-index: 18;
    }

    #notePaperActor.open {
      transform: translate(-50%, -50%) scale(1) rotate(-0.6deg);
      opacity: 1;
    }

    .note-sheet {
      position: relative;
      background:
        repeating-linear-gradient(
          transparent,
          transparent 27px,
          rgba(255, 182, 205, 0.25) 27px,
          rgba(255, 182, 205, 0.25) 28px
        ),
        linear-gradient(175deg, #fffdf7 0%, #fff4f7 100%);
      border: 2px solid #f7c6d8;
      border-radius: 18px 18px 24px 18px;
      padding: clamp(20px, 3.8vw, 28px) clamp(14px, 3.8vw, 28px) clamp(14px, 3vw, 22px);
      box-shadow:
        0 20px 44px rgba(160, 55, 90, 0.22),
        0 5px 0 #f2bfd0,
        inset 0 2px 10px #ffffff;
      text-align: center;
    }

    .note-washi-tape {
      position: absolute;
      top: -13px;
      left: 50%;
      transform: translateX(-50%) rotate(-2deg);
      width: 116px;
      height: 25px;
      background: rgba(255, 150, 185, 0.78);
      border-left: 3px dotted rgba(255,255,255,0.85);
      border-right: 3px dotted rgba(255,255,255,0.85);
      box-shadow: 0 3px 8px rgba(175, 65, 100, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.76rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    .note-line {
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.65s ease, transform 0.65s ease;
      margin-bottom: 7px;
      line-height: 1.46;
      font-size: clamp(0.86rem, 2.4vw, 1.04rem);
      font-weight: 600;
      color: #702943;
    }

    .note-line.show {
      opacity: 1;
      transform: translateY(0);
    }

    .note-line.note-highlight {
      font-size: clamp(0.95rem, 2.8vw, 1.18rem);
      font-weight: 700;
      color: #b81950;
      background: rgba(255, 224, 235, 0.68);
      border-radius: 12px;
      padding: 7px 11px;
      margin: 8px 0;
      box-shadow: inset 0 0 0 1.5px rgba(255, 165, 195, 0.6);
    }

    /* ==========================================================================
       DIALOGUE HUD & SINGLE OPENING BUTTON
       ========================================================================== */
    #dialogueLayer {
      position: absolute;
      top: max(14px, env(safe-area-inset-top, 14px));
      left: 50%;
      transform: translateX(-50%);
      width: min(600px, 92vw);
      text-align: center;
      z-index: 25;
      pointer-events: none;
    }

    .dialogue-bubble {
      display: inline-block;
      background: rgba(255, 252, 254, 0.93);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 198, 218, 0.92);
      border-radius: 24px;
      padding: 12px 20px;
      box-shadow: 0 12px 28px rgba(175, 70, 105, 0.16), inset 0 2px 4px #ffffff;
      font-size: clamp(0.98rem, 3.4vw, 1.25rem);
      font-weight: 700;
      line-height: 1.45;
      color: var(--text-dark);
      opacity: 0;
      transform: translateY(-12px) scale(0.95);
      transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.34, 1.5, 0.64, 1);
    }

    .dialogue-bubble.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    #ctaContainer {
      position: absolute;
      bottom: max(32px, env(safe-area-inset-bottom, 32px));
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      text-align: center;
      z-index: 30;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    #openLetterBtn {
      pointer-events: auto;
      cursor: pointer;
      border: none;
      outline: none;
      font-family: inherit;
      font-size: clamp(1.05rem, 4vw, 1.25rem);
      font-weight: 700;
      color: #ffffff;
      background: linear-gradient(180deg, #ff6996 0%, #ff3e75 100%);
      padding: 15px 34px;
      border-radius: 999px;
      box-shadow:
        0 10px 26px rgba(255, 62, 117, 0.42),
        0 4px 0 #c91f53,
        inset 0 2px 4px rgba(255, 255, 255, 0.65);
      opacity: 0;
      transform: translateY(16px) scale(0.9);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.5s ease, box-shadow 0.3s ease;
    }

    #openLetterBtn.ready {
      opacity: 1;
      transform: translateY(0) scale(1);
      animation: btnPulse 2.2s ease-in-out infinite;
    }

    #openLetterBtn:active {
      transform: scale(0.92);
    }

    @keyframes btnPulse {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-4px) scale(1.04); }
    }

    #finalOverlay {
      position: absolute;
      bottom: max(18px, env(safe-area-inset-bottom, 18px));
      left: 50%;
      transform: translateX(-50%);
      width: 92vw;
      text-align: center;
      z-index: 26;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1s ease, transform 1s ease;
    }

    #finalOverlay.show {
      opacity: 1;
    }

    .final-love-line {
      font-size: clamp(1.18rem, 4.2vw, 1.58rem);
      font-weight: 700;
      color: #b81d52;
      text-shadow: 0 2px 10px rgba(255, 255, 255, 0.95);
      margin-bottom: 3px;
    }

    .final-signature {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(1.45rem, 5vw, 2.1rem);
      font-weight: 700;
      color: #7d2449;
      text-shadow: 0 2px 8px rgba(255, 255, 255, 0.9);
    }

    #particleCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 20;
    }

    /* ==========================================================================
       PORTRAIT MOBILE RESPONSIVE TUNING (ĐIỆN THOẠI DỌC THẲNG)
       ========================================================================== */
    @media (max-width: 640px), (orientation: portrait) and (max-width: 768px) {
      #envelopeActor {
        top: 55%;
        width: min(275px, 76vw);
        height: min(182px, 50vw);
      }

      #strawberryBunnyActor {
        width: min(295px, 78vw);
        height: min(285px, 76vw);
      }

      /* Docked Portrait Photo on Vertical Mobile:
         Positioned neatly on the upper-right margin so it never collides with
         the Note Paper below or the Bunny in the center! */
      #photoMemoryActor {
        width: clamp(78px, 21vw, 96px);
        padding: 5px 5px 17px 5px;
      }

      #photoMemoryActor.state-on-heart {
        top: 29%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0.94) rotate(0deg);
      }

      #photoMemoryActor.state-docked-right {
        top: 24%;
        left: calc(100vw - clamp(54px, 14vw, 66px));
        transform: translate(-50%, -50%) scale(1.08) rotate(5deg);
      }

      @keyframes dockedPhotoFloat {
        0% { transform: translate(-50%, -50%) scale(1.08) rotate(4deg) translateY(0px); }
        100% { transform: translate(-50%, -50%) scale(1.08) rotate(6.5deg) translateY(-6px); }
      }

      /* Gift box visibly parked at bottom-left during Note Paper scene */
      #giftBoxActor.lower-aside {
        top: 86%;
        left: 19%;
        transform: translate(-50%, -50%) scale(0.62);
      }

      /* Note Paper Frame centered cleanly below the Bunny & Photo */
      #notePaperActor {
        top: 59%;
        width: 92vw;
      }

      .note-sheet {
        padding: 18px 14px 14px;
      }

      .note-line {
        font-size: clamp(0.84rem, 3.4vw, 0.96rem);
        margin-bottom: 6px;
        line-height: 1.42;
      }

      .note-line.note-highlight {
        font-size: clamp(0.9rem, 3.7vw, 1.04rem);
        padding: 6px 10px;
        margin: 7px 0;
      }

      /* Scene 5 Rummaging & Final Hug scaled for narrow portrait screens */
      #strawberryBunnyActor.rummaging-center {
        top: 49%;
        left: 46%;
        transform: translate(-50%, -50%) scale(1.06);
      }

      #giftBoxActor.center-in-front-of-bunny {
        top: 66%;
        left: 46%;
        transform: translate(-50%, -50%) scale(0.95);
      }

      #strawberryBunnyActor.pulling-heart-out {
        top: 51%;
        left: 48%;
        transform: translate(-50%, -50%) scale(1.08);
      }

      #strawberryBunnyActor.hugging-lowered-heart {
        top: 54%;
        left: 48%;
        transform: translate(-50%, -50%) scale(1.1);
      }

      @keyframes bunnyGentleSway {
        0% { transform: translate(-50%, -50%) scale(1.1) rotate(-4deg); }
        100% { transform: translate(-50%, -50%) scale(1.1) rotate(4deg); }
      }

      /* Scale down foreground corner flowers slightly on narrow phones */
      #gardenFlowersFront .flower-item {
        transform: scale(0.76);
      }
    }

    /* Extra compact adjustments for shorter vertical phones (e.g. iPhone SE / 667px height) */
    @media (max-height: 700px) and (orientation: portrait) {
      #notePaperActor {
        top: 61%;
      }
      .note-line {
        font-size: 0.8rem;
        margin-bottom: 4px;
      }
      .note-line.note-highlight {
        font-size: 0.86rem;
        padding: 5px 8px;
      }
      #strawberryBunnyActor.hugging-lowered-heart {
        top: 53%;
        transform: translate(-50%, -50%) scale(1.0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.25s !important;
      }
    }
  </style>
</head>
<body>
  <main id="viewportWorld" aria-label="Câu chuyện quà tặng 20 tháng 10 Thỏ Dâu Tây">
    <div class="sky-glow"></div>
    <div id="hugWarmAura"></div>

    <!-- Drifting Clouds -->
    <div class="cloud-layer">
      <div class="cloud cloud-1"></div>
      <div class="cloud cloud-2"></div>
    </div>

    <!-- Simulated 3D Camera World -->
    <div id="worldCamera">
      <div class="hills-distant"></div>
      <div class="meadow-midground"></div>
      <div class="garden-path"></div>

      <!-- Back Botanical Flower Layer -->
      <div id="gardenFlowersBack"></div>

      <!-- Center Stage Actors -->
      <div id="stageCenter">
        <!-- 1. 3D Envelope -->
        <div id="envelopeActor" class="idle-Invite">
          <div class="env-shadow"></div>
          <div class="env-back"></div>
          <div class="env-inner-glow"></div>
          <svg class="env-pocket" viewBox="0 0 310 205" preserveAspectRatio="none">
            <path d="M0,205 L155,110 L310,205 Z" fill="#fae0d4" />
            <path d="M0,0 L155,118 L0,205 Z" fill="#fff0e8" />
            <path d="M310,0 L155,118 L310,205 Z" fill="#fce8de" />
          </svg>
          <svg class="env-flap" viewBox="0 0 310 120" preserveAspectRatio="none">
            <path d="M0,0 L310,0 L155,114 Z" fill="#ffe8dc" stroke="#f5cbb8" stroke-width="2" />
          </svg>
        </div>

        <!-- 2. Gift Box Actor (Remains visible during Note Paper scene, then slides to Center for Rummaging!) -->
        <div id="giftBoxActor" aria-hidden="true">
          <svg viewBox="0 0 200 190" width="100%" height="100%" overflow="visible">
            <defs>
              <linearGradient id="boxBodyGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#ff9ebb" />
                <stop offset="100%" stop-color="#ff6996" />
              </linearGradient>
              <linearGradient id="boxLidGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#ffb5cc" />
                <stop offset="100%" stop-color="#ff7da5" />
              </linearGradient>
              <linearGradient id="creamRibbon" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#fffdf9" />
                <stop offset="100%" stop-color="#ffe7cc" />
              </linearGradient>
            </defs>
            <ellipse cx="100" cy="172" rx="68" ry="14" fill="rgba(155,55,85,0.22)" />
            <rect x="35" y="68" width="130" height="100" rx="16" fill="url(#boxBodyGrad)" stroke="#f05282" stroke-width="2" />
            <rect x="88" y="68" width="24" height="100" fill="url(#creamRibbon)" />

            <g id="giftLidGroup">

                <circle cx="100" cy="42" r="8" fill="#fffdf9" stroke="#f2d2b0" stroke-width="2" />
              </g>
            </g>
          </svg>
        </div>

        <!-- 3. STRAWBERRY-BUNNY MODEL -->
        <div id="strawberryBunnyActor">
          <svg id="strawberryBunnySvg" viewBox="0 0 360 340">
            <defs>
              <radialGradient id="strawPlushGrad" cx="38%" cy="30%" r="68%">

              <radialGradient id="bunnyPlushGrad" cx="48%" cy="34%" r="64%">

              <linearGradient id="hugArmGradRight" gradientUnits="userSpaceOnUse" x1="260" y1="195" x2="182" y2="242">

              <linearGradient id="leafPlushGrad" x1="0" y1="0" x2="1" y2="1">

              <g id="plush-seed">

                <path d="M0,-5.5 C3.2,-1.5 3.6,3.5 0,5.8 C-3.6,3.5 -3.2,-1.5 0,-5.5 Z" fill="#ffda3d" stroke="#f59e0b" stroke-width="0.7" />

              <clipPath id="bunnyBottomUpClip">
                <polygon id="unzipRevealPolygon" points="178,74 182,74 182,74 178,74" />

            </defs>

            <!-- Ground Shadow under Bunny -->
            <ellipse cx="180" cy="306" rx="84" ry="16" fill="rgba(150, 50, 80, 0.2)" />

            <!-- Upright Green Strawberry Leaves -->
            <g id="sb-leaves-group">

              <path d="M172,16 Q174,46 178,74" stroke="#8cf07a" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.7" />

            <!-- LAYER 1: WHITE PLUSH BUNNY BODY, HEAD, FEET & UNDER-HEART SHOULDER ROOTS -->
            <g id="sb-bunny-core" clip-path="url(#bunnyBottomUpClip)">
              <path d="M128,184 C118,220 120,268 140,284 C162,292 198,292 220,284 C240,268 242,220 232,184 C216,170 144,170 128,184 Z" fill="url(#bunnyPlushGrad)" stroke="#dfc2c9" stroke-width="2" />
              <ellipse cx="180" cy="234" rx="35" ry="38" fill="#ffe6ee" opacity="0.7" />

              <!-- Under-Heart Shoulder Attachment Roots (Strictly UNDERNEATH the Heart) -->
              <g id="bunny-hug-shoulders-back">
                <path d="M142,192 C122,194 102,204 102,222 C102,230 116,232 136,224 Z" fill="url(#hugArmGradLeft)" />
                <path d="M129,194 C114,198 102,207 102,222" stroke="#d4b2bc" stroke-width="2.2" fill="none" stroke-linecap="round" />
                <path d="M218,192 C238,194 258,204 258,222 C258,230 244,232 224,224 Z" fill="url(#hugArmGradRight)" />
                <path d="M231,194 C246,198 258,207 258,222" stroke="#d4b2bc" stroke-width="2.2" fill="none" stroke-linecap="round" />

              <!-- Bunny Head & Chubby Cheeks -->

                  <circle cx="151.5" cy="154" r="1.3" fill="#ffffff" opacity="0.8" />

                  <circle cx="206" cy="151" r="8.8" fill="#4f0e17" stroke="#7d1e2b" stroke-width="1.5" />
                  <circle cx="203.4" cy="148.2" r="2.9" fill="#ffffff" />
                  <circle cx="208.5" cy="154" r="1.3" fill="#ffffff" opacity="0.8" />
                </g>

                <g id="bunny-nose-mouth">
                  <path d="M180,161 C175.5,155.5 168.5,158 170.5,164 C172.2,168.8 180,172.5 180,172.5 C180,172.5 187.8,168.8 189.5,164 C191.5,158 184.5,155.5 180,161 Z" fill="#ff859d" stroke="#b83b54" stroke-width="1.6" />

    /* ==========================================================================
       PHASE 1: ZIPPER SLIDES ALL THE WAY TO THE BOTTOM
       PHASE 2: STRAWBERRY PEEL SEPARATES FROM THE BOTTOM UPWARD
       ========================================================================== */
    function animateZipperThenBottomUpPeel(duration = 1950) {
      return new Promise((resolve) => {
        const startTime = performance.now();
        zipperSpark.style.opacity = '1';

        function step(now) {
          const elapsed = now - startTime;
          const t = Math.min(1, elapsed / duration);

          if (t <= 0.48) {
            const zipP = t / 0.48;
            const easeZip = 1 - Math.pow(1 - zipP, 2);
            const currentZipY = 76 + easeZip * 208;

            zipperPull.setAttribute('transform', `translate(180, ${currentZipY})`);
            zipperWhiteSlit.setAttribute('y2', String(currentZipY));

            unzipPolygon.setAttribute(
              'points',
              `177,74 183,74 183,${currentZipY} 177,${currentZipY}`
            );
          } else {
            const peelP = (t - 0.48) / 0.52;
            const easePeel = 1 - Math.pow(1 - peelP, 2.8);

            zipperPull.style.opacity = String(Math.max(0, 1 - peelP * 2.5));
            zipperWhiteSlit.style.opacity = String(Math.max(0, 1 - peelP * 2));

            const bottomHalfWidth = 8 + easePeel * 165;
            const topHalfWidth = 4 + Math.pow(easePeel, 1.8) * 145;
            const topRevealY = 286 - easePeel * 214;

            unzipPolygon.setAttribute(
              'points',
              `${180 - topHalfWidth},${topRevealY} ${180 + topHalfWidth},${topRevealY} ${180 + bottomHalfWidth},315 ${180 - bottomHalfWidth},315`
            );

            const liftAngle = easePeel * 42;
            closedHalfLeft.style.transform = `rotate(${liftAngle}deg)`;
            closedHalfRight.style.transform = `rotate(${-liftAngle}deg)`;
            closedShell.style.opacity = String(1 - easePeel);

            wingLeft.style.opacity = String(easePeel);
            wingRight.style.opacity = String(easePeel);
            const startInwardAngle = (1 - easePeel) * -28;
            wingLeft.style.transform = `rotate(${startInwardAngle}deg) scaleX(${0.62 + 0.38 * easePeel})`;
            wingRight.style.transform = `rotate(${-startInwardAngle}deg) scaleX(${0.62 + 0.38 * easePeel})`;
          }

          if (t < 1) {
            requestAnimationFrame(step);
          } else {
            closedShell.style.display = 'none';
            wingLeft.style.transform = '';
            wingRight.style.transform = '';
            unzipPolygon.setAttribute('points', '0,0 360,0 360,340 0,340');
            bunny.classList.add('ears-flapping');
            resolve();
          }
        }

        requestAnimationFrame(step);
      });
    }

        return `<svg viewBox="0 0 60 120" width="100%" height="100%">
          ${stem}
          <path d="M16,35 C16,56 44,56 44,35 C44,20 36,12 36,12 L30,24 L24,12 C24,12 16,20 16,35 Z" fill="${color}" />
          <path d="M22,36 C22,52 38,52 38,36 C38,24 30,14 30,14 C30,14 22,24 22,36 Z" fill="rgba(255,255,255,0.28)" />
        </svg>`;
      }
      if (type === 'daisy') {
        return `<svg viewBox="0 0 60 120" width="100%" height="100%">
          ${stem}
          <g transform="translate(30,36)">
            ${[0,45,90,135,180,225,270,315].map(a => `<ellipse cx="0" cy="-14" rx="5.5" ry="11" fill="#ffffff" transform="rotate(${a})"/>`).join('')}
            <circle cx="0" cy="0" r="8.5" fill="#ffd43b" stroke="#f59f00" stroke-width="1.5"/>
          </g>
        </svg>`;
      }
      if (type === 'cosmos') {
        return `<svg viewBox="0 0 60 120" width="100%" height="100%">
          ${stem}
          <g transform="translate(30,36)">
            ${[0,60,120,180,240,300].map(a => `<path d="M0,0 C-7,-18 7,-18 0,0" fill="${color}" transform="rotate(${a}) scale(1.4)"/>`).join('')}
            <circle cx="0" cy="0" r="5.5" fill="#ffec99"/>
          </g>
        </svg>`;
      }
      return `<svg viewBox="0 0 60 120" width="100%" height="100%">
        ${stem}
        <g fill="#b197fc">
          <ellipse cx="30" cy="16" rx="4.5" ry="6"/>
          <ellipse cx="25" cy="25" rx="4.5" ry="6" transform="rotate(-18 25 25)"/>
          <ellipse cx="35" cy="25" rx="4.5" ry="6" transform="rotate(18 35 25)"/>
          <ellipse cx="24" cy="36" rx="5" ry="6.5" transform="rotate(-18 24 36)"/>
          <ellipse cx="36" cy="36" rx="5" ry="6.5" transform="rotate(18 36 36)"/>
          <ellipse cx="26" cy="47" rx="4.5" ry="6" transform="rotate(-14 26 47)"/>
          <ellipse cx="34" cy="47" rx="4.5" ry="6" transform="rotate(14 34 47)"/>
        </g>
      </svg>`;
    }

    function populateGarden() {
      const backContainer = document.getElementById('gardenFlowersBack');
      const frontContainer = document.getElementById('gardenFlowersFront');

      const backSpecs = [
        { type: 'tulip', color: '#ff85a2', left: '5%', bottom: '23%', size: 60 },
        { type: 'daisy', color: '#fff', left: '14%', bottom: '26%', size: 54 },
        { type: 'lavender', color: '#b197fc', left: '23%', bottom: '25%', size: 58 },
        { type: 'cosmos', color: '#ffa8c5', left: '75%', bottom: '26%', size: 56 },
        { type: 'tulip', color: '#ffc078', left: '84%', bottom: '23%', size: 62 },
        { type: 'daisy', color: '#fff', left: '91%', bottom: '20%', size: 52 }
      ];

      const frontSpecs = [
        { type: 'tulip', color: '#ff6b8b', left: '1%', bottom: '-3%', size: 86 },
        { type: 'daisy', color: '#fff', left: '10%', bottom: '-5%', size: 78 },
        { type: 'cosmos', color: '#eebefa', left: '20%', bottom: '-6%', size: 76 },
        { type: 'lavender', color: '#9775fa', left: '78%', bottom: '-5%', size: 82 },
        { type: 'daisy', color: '#fff', left: '86%', bottom: '-4%', size: 78 },
        { type: 'tulip', color: '#ffa94d', left: '92%', bottom: '-3%', size: 88 }
      ];

      backSpecs.forEach((s, idx) => {
        const el = document.createElement('div');
        el.className = 'flower-item bud-closed';
        el.style.left = s.left;
        el.style.bottom = s.bottom;
        el.style.width = `${s.size}px`;
        el.style.height = `${s.size * 1.8}px`;
        el.style.animationDelay = `${idx * -0.6}s`;
        el.innerHTML = createFlowerSVG(s.type, s.color);
        backContainer.appendChild(el);
      });

      frontSpecs.forEach((s, idx) => {
        const el = document.createElement('div');
        el.className = 'flower-item';
        el.style.left = s.left;
        el.style.bottom = s.bottom;
        el.style.width = `${s.size}px`;
        el.style.height = `${s.size * 1.8}px`;
        el.style.animationDelay = `${idx * -0.45}s`;
        el.innerHTML = createFlowerSVG(s.type, s.color);
        frontContainer.appendChild(el);
      });
    }

    function bloomAllFlowers() {
      document.querySelectorAll('.flower-item.bud-closed').forEach((el, i) => {
        setTimeout(() => {
          el.classList.remove('bud-closed');
          el.classList.add('bloomed');
        }, i * 130);
      });
    }

    /* ==========================================================================
       FULL-VIEWPORT PARTICLE SYSTEM
       ========================================================================== */
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    const particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function createParticle(burstX = null, burstY = null) {
      const isBurst = burstX !== null && burstY !== null;
      const types = ['heart', 'petal', 'sparkle'];
      return {
        x: isBurst ? burstX : Math.random() * canvas.width,
        y: isBurst ? burstY : canvas.height + 20,
        vx: isBurst ? (Math.random() - 0.5) * 7 : (Math.random() - 0.5) * 0.9,
        vy: isBurst ? -Math.random() * 6 - 1.5 : -Math.random() * 1.2 - 0.4,
        size: Math.random() * 8 + 6,
        type: types[Math.floor(Math.random() * types.length)],
        color: ['#ff6b95', '#ff9ebb', '#ffd6e5', '#ffe066'][Math.floor(Math.random() * 4)],
        rot: Math.random() * Math.PI * 2,
        vRot: (Math.random() - 0.5) * 0.04,
        alpha: 0.88,
        life: isBurst ? 110 : 999999
      };
    }

    for (let i = 0; i < 22; i++) {
      const p = createParticle();
      p.y = Math.random() * canvas.height;
      particles.push(p);
    }

    function spawnBurst(xRatio, yRatio, count = 22) {
      const bx = canvas.width * xRatio;
      const by = canvas.height * yRatio;
      for (let i = 0; i < count; i++) {
        particles.push(createParticle(bx, by));
      }
    }

    function renderParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.vRot;
        if (p.life < 500) {
          p.life--;
          p.alpha = Math.max(0, p.life / 110);
          if (p.life <= 0) {
            particles.splice(i, 1);
            continue;
          }
        } else if (p.y < -30) {
          p.y = canvas.height + 20;
          p.x = Math.random() * canvas.width;
        }

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;

        if (p.type === 'heart') {
          const s = p.size * 0.55;
          ctx.beginPath();
          ctx.moveTo(0, s);
          ctx.bezierCurveTo(-s * 1.4, -s * 0.4, -s * 0.7, -s * 1.5, 0, -s * 0.5);
          ctx.bezierCurveTo(s * 0.7, -s * 1.5, s * 1.4, -s * 0.4, 0, s);
          ctx.fill();
        } else if (p.type === 'petal') {
          ctx.beginPath();
          ctx.ellipse(0, 0, p.size * 0.45, p.size * 0.85, 0, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.beginPath();
          ctx.arc(0, 0, p.size * 0.28, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
      requestAnimationFrame(renderParticles);
    }

    /* ==========================================================================
       SCENE TIMELINE ORCHESTRATION
       ========================================================================== */
    async function initIntroScene() {
      populateGarden();
      renderParticles();
      openBtn.textContent = SCRIPT.button;

      await wait(500);
      await showDialogue(SCRIPT.d1);
      await wait(1750);
      await showDialogue(SCRIPT.d2);
      await wait(900);
      openBtn.classList.add('ready');
    }

    async function runFullStory() {
      if (storyStarted) return;
      storyStarted = true;
      openBtn.disabled = true;

      spawnBurst(0.5, 0.85, 20);
      ctaContainer.style.opacity = '0';
      ctaContainer.style.transform = 'translateX(-50%) scale(0.8)';
      setTimeout(() => { ctaContainer.style.display = 'none'; }, 500);

      /* ----------------------------------------------------------------------
         SCENE 1 -> 2: ENVELOPE OPENS -> FULL ZIPPER DOWN -> BOTTOM-UP PEEL
         ---------------------------------------------------------------------- */
      envelope.classList.remove('idle-Invite');
      setCamera(1.08, 0, 2);
      envelope.classList.add('open');
      await wait(800);

      bunny.style.transform = 'translate(-50%, -52%) scale(0.92)';
      await animateZipperThenBottomUpPeel(1950);

      spawnBurst(0.5, 0.48, 28);
      bunny.style.transform = 'translate(-50%, -50%) scale(0.98)';
      envelope.classList.add('fade-away');

      await showDialogue(SCRIPT.d3);
      await wait(2700);

      /* ----------------------------------------------------------------------
         SCENE 2 -> 3: BUNNY RUNS TO GIFT BOX ("Ở đây có 1 hộp quà")
         + OPENS BOX + BUTTERFLY DELIVERS COUPLE PHOTO TO HEART -> DOCKS RIGHT
         ---------------------------------------------------------------------- */
      await showDialogue(SCRIPT.d4);
      bunny.classList.add('ears-excited', 'hopping');
      setCamera(1.04, -2, 0);
      bloomAllFlowers();
      await wait(2300);

      bunny.classList.remove('hopping');
      giftBox.classList.add('visible');
      bunny.style.left = isPortraitMobile() ? '38%' : '42%';
      bunny.style.transform = 'translate(-50%, -48%) scale(0.92)';
      setCamera(1.05, -1, -1);

      await showDialogue(SCRIPT.d_box_here);
      await wait(1650);

      // Bunny unties and opens the gift box
      bunny.classList.add('opening-box');
      giftBox.classList.add('react-touch');
      await wait(550);

      giftBox.classList.add('open');
      spawnBurst(0.6, 0.55, 26);
      world.classList.add('warm-bloom');
      await wait(600);

      // Bunny lifts the glowing heart up high while butterfly places photo onto the heart
      bunny.classList.remove('opening-box');
      bunny.style.left = '50%';
      bunny.classList.add('lifting-gift');
      giftBox.classList.add('lower-aside');
      spawnBurst(0.5, 0.36, 28);

      await runButterflyPhotoDelivery();
      await wait(950);

      // Move photo to the right margin & scale up slightly
      photoMemory.classList.remove('state-on-heart');
      photoMemory.classList.add('state-docked-right');

      /* ----------------------------------------------------------------------
         SCENE 3 -> 4: "Ở ĐÂY CÓ 1 MẢNH GIẤY NOTE"
         On Portrait Mobile, Bunny sits at top-left (34%) while the Couple Photo
         is docked at top-right (78%), leaving the middle clean for the Note Paper!
         ---------------------------------------------------------------------- */
      bunny.classList.remove('lifting-gift', 'ears-excited');
      bunny.classList.add('ears-flapping');
      await showDialogue(SCRIPT.d_note_found);
      await wait(2200);

      setCamera(1, 0, 0);
      bunny.style.top = isPortraitMobile() ? '24%' : '23%';
      bunny.style.left = isPortraitMobile() ? '34%' : '50%';
      bunny.style.transform = isPortraitMobile()
        ? 'translate(-50%, -50%) scale(0.66)'
        : 'translate(-50%, -50%) scale(0.72)';
      hideDialogue();

      // Open Note Paper frame & reveal all wishes sequentially inside the Note Paper
      notePaper.classList.add('open');
      spawnBurst(0.5, 0.58, 18);
      await wait(650);

      noteLine1.textContent = SCRIPT.d5;
      noteLine1.classList.add('show');
      await wait(3100);

      noteLine2.textContent = SCRIPT.d6;
      noteLine2.classList.add('show');
      await wait(3100);

      noteLine3.textContent = SCRIPT.d7;
      noteLine3.classList.add('show');
      await wait(3200);

      noteLine4.textContent = SCRIPT.d8;
      noteLine4.classList.add('show');
      spawnBurst(0.5, 0.55, 22);
      await wait(4800);

      noteLine5.textContent = SCRIPT.d9;
      noteLine5.classList.add('show');
      await wait(4200);

      /* ----------------------------------------------------------------------
         SCENE 5: FINAL SURPRISE GIFT
         1. Close Note Paper, scale up Bunny & slide the visible Gift Box to center
         2. Show dialogue: "Và còn 1 cái gì đó nữa này… 🎁✨" BEFORE rummaging
         3. Left paw pushes down -> Box tilts Left; Right paw pushes down -> Box tilts Right
         4. Pull out the Heart, lower it down to chest, wrap curved forearms over the front
            (with shoulder roots tucked strictly UNDERNEATH the heart) + sway & flap ears!
         ---------------------------------------------------------------------- */
      notePaper.classList.remove('open');
      await wait(650);

      // Clear inline top/left overrides so CSS classes control Scene 5 positioning cleanly
      bunny.style.top = '';
      bunny.style.left = '';
      bunny.style.transform = '';

      bunny.classList.add('rummaging-center');
      giftBox.classList.remove('lower-aside');
      giftBox.classList.add('center-in-front-of-bunny');

      await showDialogue(SCRIPT.d_one_more_thing);
      await wait(2000);

      await runSynchronizedBoxRummage();

      giftBox.classList.remove('center-in-front-of-bunny');
      giftBox.style.opacity = '0';
      giftBox.style.transform = 'translate(-50%, 10%) scale(0.4)';

      bunny.classList.remove('rummaging-center');
      bunny.classList.add('pulling-heart-out');
      spawnBurst(0.5, 0.45, 26);
      await wait(950);

      bunny.classList.remove('pulling-heart-out');
      bunny.classList.add('ears-flapping', 'hugging-lowered-heart');
      hugWarmAura.classList.add('active');
      spawnBurst(0.5, 0.52, 34);

      await showDialogue(SCRIPT.d10);
      await wait(3800);

      finalLoveText.textContent = SCRIPT.d11;
      finalSigText.textContent = SCRIPT.signature;
      finalOverlay.classList.add('show');
      spawnBurst(0.5, 0.48, 38);
    }

    openBtn.addEventListener('click', runFullStory, { once: true });
    window.addEventListener('DOMContentLoaded', initIntroScene);
  </script>
